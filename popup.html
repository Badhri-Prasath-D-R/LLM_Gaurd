<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 340px;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 14px;
      background: #1e1e1e;
      color: #eee;
    }
    h3 { margin: 0 0 10px; font-size: 15px; }
    .row { margin-bottom: 8px; }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #eee;
      font-size: 12px;
    }
    textarea { resize: vertical; min-height: 60px; }
    button {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      border: none;
      border-radius: 6px;
      background: #4f8ef7;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { background: #555; cursor: not-allowed; }
    #status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 160px;
      overflow-y: auto;
    }
    .ok { background: #14351f; border: 1px solid #2f8f4e; }
    .err { background: #3a1a1a; border: 1px solid #a33; }
    .pending { background: #333; border: 1px solid #666; }
    label { font-size: 11px; color: #aaa; }

    .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab-btn {
      flex: 1; margin: 0; padding: 6px;
      background: #2a2a2a; color: #aaa; font-weight: 500; font-size: 12px;
    }
    .tab-btn.active { background: #4f8ef7; color: white; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .doc-list { margin-top: 10px; max-height: 200px; overflow-y: auto; }
    .doc-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 8px; margin-bottom: 4px;
      background: #2a2a2a; border-radius: 5px; font-size: 12px;
    }
    .doc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; margin-right: 8px; }
    .doc-meta { font-size: 10px; color: #888; }
    .delete-btn {
      width: auto; padding: 3px 8px; margin: 0; font-size: 11px;
      background: #a33; flex-shrink: 0;
    }
    .empty-note { font-size: 12px; color: #888; text-align: center; padding: 12px 0; }
  </style>
</head>
<body>
  <h3>LLM Guard</h3>

  <div class="tabs">
    <button class="tab-btn active" data-tab="connection">Connection</button>
    <button class="tab-btn" data-tab="knowledge">Knowledge Base</button>
  </div>

  <div id="tab-connection" class="tab-panel active">
    <div class="row">
      <label>Base URL</label>
      <input id="baseUrl" type="text" placeholder="http://localhost:1234" />
    </div>

    <div class="row">
      <label>Model ID (as shown in LM Studio)</label>
      <input id="modelId" type="text" placeholder="google/gemma-4-e4b" />
    </div>

    <div class="row">
      <label>Test message</label>
      <textarea id="testMsg">Say "connected" if you can read this.</textarea>
    </div>

    <button id="testBtn">Test Connection</button>

    <div id="status" class="pending">Idle.</div>
  </div>

  <div id="tab-knowledge" class="tab-panel">
    <div class="row">
      <label>Embedding Model ID (must be loaded in LM Studio)</label>
      <input id="embeddingModelId" type="text" placeholder="nomic-embed-text" />
    </div>
    <div class="row">
      <label style="display:flex; align-items:center; gap:6px;">
        <input id="ragEnabled" type="checkbox" style="width:auto;" />
        <span>Use this knowledge base for AI review</span>
      </label>
    </div>

    <div class="row">
      <label>Upload a text file (.txt, .md)</label>
      <input id="fileInput" type="file" accept=".txt,.md" />
    </div>

    <div class="row">
      <label>Or paste text directly</label>
      <textarea id="pasteText" placeholder="Paste sensitive policy text, codenames, snippets..."></textarea>
      <input id="pasteName" type="text" placeholder="Name for this entry" style="margin-top:6px;" />
    </div>

    <button id="addTextBtn">Add to Knowledge Base</button>

    <div id="kbStatus" class="pending" style="display:none;"></div>

    <div id="docList" class="doc-list"></div>
  </div>

  <script src="rag-store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
